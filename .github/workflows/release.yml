name: Android Release (APK + AAB)

# Builds a signed release APK + AAB and publishes them to GitHub Releases.
# Trigger: push a version tag (e.g. v1.18.5) or run manually from the Actions tab.
#
# Signing (optional — recommended for Play Store):
#   Repo Settings -> Secrets and variables -> Actions -> New repository secret:
#     ANDROID_KEYSTORE_BASE64   = base64 of nexus-release-key.keystore
#         (create locally with:
#          keytool -genkeypair -v -storetype PKCS12 \
#            -keystore nexus-release-key.keystore -alias nexus_key_alias \
#            -keyalg RSA -keysize 2048 -validity 10000
#          then: base64 -w0 nexus-release-key.keystore )
#     ANDROID_STORE_PASSWORD    = keystore password
#     ANDROID_KEY_PASSWORD      = key password
#   Without these secrets the workflow still succeeds and produces a
#   debug-signed APK + AAB (installable for testing).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish/attach to (e.g. v1.18.5). Leave empty for a build-only artifact run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    # Pinned to ubuntu-24.04 so the preinstalled Android SDK/NDK remains
    # available at ANDROID_HOME after ubuntu-latest migrated to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Resolve release version label
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="true"
          elif [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
            SHOULD_PUBLISH="true"
          else
            RELEASE_TAG="${GITHUB_REF_NAME:-manual}"
            SHOULD_PUBLISH="false"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "SHOULD_PUBLISH=${SHOULD_PUBLISH}" >> "$GITHUB_ENV"
          echo "Artifact label: ${RELEASE_TAG} (publish to GitHub Release: ${SHOULD_PUBLISH})"

      - name: Install JS dependencies
        run: |
          chmod +x scripts/postinstall.sh android/gradlew
          yarn install --frozen-lockfile || yarn install

      # react-native-dotenv inlines `@env` imports at bundle time from .env.
      - name: Create .env file
        run: |
          cat > .env << EOL
          FIREBASE_FUNCTIONS_URL=${{ vars.FIREBASE_FUNCTIONS_URL }}

          # PalsHub/Supabase Configuration
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          PALSHUB_API_BASE_URL=${{ vars.PALSHUB_API_BASE_URL }}

          # App Configuration
          APP_URL=nexus://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EOL
          if [ -z "${{ vars.SUPABASE_URL }}" ]; then
            echo "::warning::SUPABASE_URL repo variable is not set — PalsHub/auth features will be inert in this build."
          fi

      # android/app/build.gradle applies the google-services plugin
      # unconditionally, so google-services.json must exist for every build.
      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.nexusai.nexus"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.nexusai.nexus.e2e"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              }
            ]
          }
          EOL

      - name: Use the real google-services.json when the secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — keeping the dummy file; Firebase features will be non-functional in the built APK/AAB."
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/nexus-release-key.keystore
            echo "Keystore decoded: $(wc -c < android/app/nexus-release-key.keystore) bytes"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK/AAB will be debug-signed."
          fi

      - name: Build release APK + AAB
        env:
          APP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          APP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"'
        run: |
          cd android
          chmod +x ./gradlew
          if [ -z "$APP_RELEASE_STORE_PASSWORD" ] || [ -z "$APP_RELEASE_KEY_PASSWORD" ] || [ ! -f app/nexus-release-key.keystore ]; then
            echo "Signing credentials or keystore absent — release build will be debug-signed."
            unset APP_RELEASE_STORE_PASSWORD APP_RELEASE_KEY_PASSWORD
          fi
          ./gradlew assembleProdRelease bundleProdRelease --no-daemon

      - name: Rename artifacts
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk \
             "Nexus-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/bundle/prodRelease/app-prod-release.aab \
             "Nexus-${RELEASE_TAG}.aab"
          ls -lh "Nexus-${RELEASE_TAG}.apk" "Nexus-${RELEASE_TAG}.aab"

      - name: Retain APK + AAB run artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Nexus-${{ env.RELEASE_TAG }}-android
          path: |
            Nexus-*.apk
            Nexus-*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nexus ${{ env.RELEASE_TAG }}
          body: |
            ## Nexus ${{ env.RELEASE_TAG }}

            **Install:** download `Nexus-*.apk` below and open it on your
            Android device (allow "install unknown apps" if prompted).

            After installing, open the **Models** tab and download a
            Nexus model (Nexus 1.0 Nano for low-RAM devices, Nexus 2.0+ for
            8 GB+ devices). All inference runs fully on-device.

            Prefer a store build? Use `Nexus-*.aab` for Google Play upload.
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            Nexus-*.apk
            Nexus-*.aab
