name: iOS Release (IPA)

# Builds the Nexus iOS app and publishes an installable .ipa to GitHub
# Releases alongside the Android APK/AAB.
# Trigger: push a version tag (e.g. v1.18.5) or run manually from the Actions tab.
#
# What it produces:
#   Nexus-<tag>.ipa — an unsigned release IPA (payload packed from an
#   xcarchive built with CODE_SIGNING_ALLOWED=NO). Installable on Apple
#   devices via AltStore, Sideloadly, or TrollStore, which re-sign the
#   bundle with their own certificate.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the IPA to this release tag (e.g. v1.18.5). Leave empty for a build-only artifact run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Resolve release version label
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="true"
          elif [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
            SHOULD_PUBLISH="true"
          else
            RELEASE_TAG="${GITHUB_REF_NAME:-manual}"
            SHOULD_PUBLISH="false"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "SHOULD_PUBLISH=${SHOULD_PUBLISH}" >> "$GITHUB_ENV"
          echo "Artifact label: ${RELEASE_TAG} (publish to GitHub Release: ${SHOULD_PUBLISH})"

      - name: Install JS dependencies
        run: |
          chmod +x scripts/postinstall.sh
          yarn install --frozen-lockfile || yarn install

      - name: Create .env file
        run: |
          cat > .env << EOL
          FIREBASE_FUNCTIONS_URL=${{ vars.FIREBASE_FUNCTIONS_URL }}

          # PalsHub/Supabase Configuration
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          PALSHUB_API_BASE_URL=${{ vars.PALSHUB_API_BASE_URL }}

          # App Configuration
          APP_URL=nexus://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EOL
          if [ -z "${{ vars.SUPABASE_URL }}" ]; then
            echo "::warning::SUPABASE_URL repo variable is not set — PalsHub/auth features will be inert in this build."
          fi

      - name: Create iOS Env.xcconfig
        run: |
          cat > ios/Config/Env.xcconfig << 'EOL'
          GOOGLE_WEB_CLIENT_ID = dummy-web-client-id.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.dummy-ios-client-id
          EOL

      - name: Create dummy GoogleService-Info.plist
        run: |
          cat > ios/GoogleService-Info.plist << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>dummy-api-key-for-ci-builds</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.nexusai.nexus</string>
            <key>PROJECT_ID</key>
            <string>dummy-project-for-ci</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy-project-for-ci.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOL
          cp ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist

      - name: Use the real GoogleService-Info.plist when the secret is set
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > ios/GoogleService-Info.plist
            cp ios/GoogleService-Info.plist ios/PocketPal/GoogleService-Info.plist
            echo "GoogleService-Info.plist written from secret."
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST not set — keeping the dummy plist; Firebase features will be non-functional in the built IPA."
          fi

      - name: Install pods
        run: |
          cd ios
          bundle exec pod install --repo-update

      - name: Build unsigned release archive
        env:
          RCT_NO_LAUNCH_PACKAGER: 1
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set -euo pipefail
          SIGNING=(
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            CODE_SIGN_STYLE=Manual
            DEVELOPMENT_TEAM=""
            PROVISIONING_PROFILE_SPECIFIER=""
          )
          if xcodebuild \
              -workspace ios/PocketPal.xcworkspace \
              -scheme PocketPal \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath ios/build/Nexus.xcarchive \
              "${SIGNING[@]}" \
              archive > ios/xcodebuild-archive.log 2>&1; then
            echo "Archive succeeded."
          else
            echo "::warning::Archive failed; falling back to unsigned device build. Last 80 log lines:"
            tail -n 80 ios/xcodebuild-archive.log || true
            xcodebuild \
              -workspace ios/PocketPal.xcworkspace \
              -scheme PocketPal \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ios/build \
              "${SIGNING[@]}" \
              build > ios/xcodebuild-build.log 2>&1
            echo "Device build succeeded."
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find \
            ios/build/Nexus.xcarchive/Products/Applications \
            ios/build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)
          test -n "$APP_PATH" || { echo "::error::No .app found in archive or fallback build dir"; exit 1; }
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload
          rm -f "Nexus-${RELEASE_TAG}.ipa"
          zip -qry "Nexus-${RELEASE_TAG}.ipa" Payload
          ls -lh "Nexus-${RELEASE_TAG}.ipa"

      - name: Retain IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nexus-${{ env.RELEASE_TAG }}-ipa
          path: Nexus-*.ipa
          if-no-files-found: error
          retention-days: 14

      # Retry-hardened release upload via gh CLI so concurrent tag runs
      # (Android + iOS starting on the same tag) or transient GitHub upload
      # errors never fail the release publish step.
      - name: Publish GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_FILE="Nexus-${RELEASE_TAG}.ipa"
          PRERELEASE_ARGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if gh release upload "$RELEASE_TAG" "$IPA_FILE" --clobber; then
                echo "Uploaded $IPA_FILE to existing release $RELEASE_TAG."
                exit 0
              fi
            else
              if gh release create "$RELEASE_TAG" "$IPA_FILE" \
                  --title "Nexus AI (Nexus Assistant) ${RELEASE_TAG} — Offline On-Device AI by brutal-45" \
                  --generate-notes \
                  "${PRERELEASE_ARGS[@]}"; then
                echo "Created release $RELEASE_TAG with $IPA_FILE."
                exit 0
              fi
            fi
            wait_sec=$((attempt * 15))
            echo "::warning::Release publish attempt ${attempt}/5 failed; retrying in ${wait_sec}s..."
            sleep "$wait_sec"
          done

          echo "::error::Failed to publish $IPA_FILE to release $RELEASE_TAG after 5 attempts."
          exit 1
