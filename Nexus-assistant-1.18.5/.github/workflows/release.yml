name: Android Release (APK + AAB)

# Builds a signed release APK + AAB and publishes them to GitHub Releases.
# Trigger: push a version tag (v1.0.0) or run manually from the Actions tab.
#
# Signing (optional but recommended):
#   Repo Settings → Secrets and variables → Actions → New repository secret:
#     ANDROID_KEYSTORE_BASE64   = base64 of your release keystore
#         (create locally with:
#          keytool -genkeypair -v -storetype PKCS12 \
#            -keystore nexus-release-key.keystore -alias nexus_key_alias \
#            -keyalg RSA -keysize 2048 -validity 10000
#          then: base64 -w0 nexus-release-key.keystore )
#     ANDROID_STORE_PASSWORD    = keystore password
#     ANDROID_KEY_PASSWORD      = key password
#   Without these secrets the workflow still succeeds and publishes a
#   debug-signed APK (installable for testing, not for Play Store).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile || yarn install

      # react-native-dotenv inlines `@env` imports at bundle time from .env.
      # With no .env the imports compile to `undefined` *silently* — the APK
      # builds fine but Supabase/PalsHub/auth are dead at runtime. Repo
      # variables are used when configured, matching release.yml.
      - name: Create .env file
        run: |
          cat > .env << EOL
          FIREBASE_FUNCTIONS_URL=${{ vars.FIREBASE_FUNCTIONS_URL }}

          # PalsHub/Supabase Configuration
          SUPABASE_URL=${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          PALSHUB_API_BASE_URL=${{ vars.PALSHUB_API_BASE_URL }}

          # App Configuration
          APP_URL=nexus://app

          # Feature Flags (true/false)
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true

          # Google Sign-In Configuration
          GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          EOL
          if [ -z "${{ vars.SUPABASE_URL }}" ]; then
            echo "::warning::SUPABASE_URL repo variable is not set — PalsHub/auth features will be inert in this build."
          fi

      # android/app/build.gradle applies the google-services plugin
      # unconditionally, so the file must exist for any build. Start from a
      # dummy (same pattern as the CI workflow); the next step replaces it
      # with the real file when the secret is configured.
      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.nexusai.nexus"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Use the real google-services.json when the secret is set
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON not set — keeping the dummy file; Firebase features will be non-functional in the built APK/AAB."
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/nexus-release-key.keystore
            echo "Keystore decoded: $(wc -c < android/app/nexus-release-key.keystore) bytes"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK will be debug-signed."
          fi

      - name: Build release APK + AAB
        env:
          APP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          APP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          # Unset empty signing vars so build.gradle's release signingConfig
          # leaves storeFile null and the documented debug-signing fallback
          # runs. (Empty strings are already falsy in Groovy, so this is
          # belt-and-braces — it also keeps the log honest about which
          # signing path was taken.)
          if [ -z "$APP_RELEASE_STORE_PASSWORD" ] || [ -z "$APP_RELEASE_KEY_PASSWORD" ]; then
            echo "No signing credentials — release build will be debug-signed."
            unset APP_RELEASE_STORE_PASSWORD APP_RELEASE_KEY_PASSWORD
          fi
          # The app defines product flavors (prod/e2e), so the bare
          # assembleRelease/bundleRelease tasks do not exist. Pin the prod
          # flavor — the shipped applicationId — exactly as the release
          # workflow and CI do.
          ./gradlew assembleProdRelease bundleProdRelease --no-daemon

      - name: Rename artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          # Flavored output paths (flavor `prod`, buildType `release` /
          # `prodRelease` for the bundle):
          #   app/build/outputs/apk/prod/release/app-prod-release.apk
          #   app/build/outputs/bundle/prodRelease/app-prod-release.aab
          # Both are always produced by the build step above, so a missing
          # file must fail the run rather than be swallowed.
          set -euo pipefail
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk \
             "Nexus-${VERSION}.apk"
          cp android/app/build/outputs/bundle/prodRelease/app-prod-release.aab \
             "Nexus-${VERSION}.aab"
          ls -lh "Nexus-${VERSION}.apk" "Nexus-${VERSION}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus ${{ github.ref_name }}
          body: |
            ## Nexus ${{ github.ref_name }}

            **Install:** download `Nexus-*.apk` below and open it on your
            Android device (allow "install unknown apps" if prompted).

            After installing, open the **Models** tab and download a
            Nexus model (Nexus 1.0 Nano for low-RAM devices, Nexus 2.0 for
            8 GB+ devices). All inference runs fully on-device.

            Prefer a store build? Use `Nexus-*.aab` for Google Play upload.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            Nexus-*.apk
            Nexus-*.aab
